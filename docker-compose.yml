services:
  msc-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msc-api
    ports:
      - "8000:8000"
    volumes:
      - /home/astro/msc/data:/app/data
      - /home/astro/msc/backups:/app/backups
      - /home/astro/.msc/memory:/home/astro/.msc/memory:rw
      - /home/astro/.claude/projects/-home-astro/memory:/home/astro/.claude/projects/-home-astro/memory:rw
    environment:
      - MSC_DB_PATH=/app/data/msc.db
      - MSC_MEMORY_DIR=/home/astro/.msc/memory
      - MSC_CLAUDE_MEMORY_DIR=/home/astro/.claude/projects/-home-astro/memory
      - MSC_BACKUP_DIR=/app/backups
      # LAN mode: no login, no token, nothing expires.
      # Set MSC_AUTH_ENABLED=true in .env to switch JWT/API-Key auth back on.
      - MSC_AUTH_ENABLED=${MSC_AUTH_ENABLED:-false}
      - MSC_SECRET_KEY=${MSC_SECRET_KEY:-change-me-in-production}
      - MSC_INITIAL_ADMIN_KEY=${MSC_INITIAL_ADMIN_KEY:-}
      - MSC_BIND_HOST=0.0.0.0
      - MSC_CORS_ORIGINS=${MSC_CORS_ORIGINS:-*}
      # Address agents should use; only affects /api/v1/help and /llms.txt.
      - MSC_PUBLIC_URL=${MSC_PUBLIC_URL:-}
      - MSC_READ_ONLY=${MSC_READ_ONLY:-false}
      - MSC_HEALTH_DETAIL=${MSC_HEALTH_DETAIL:-true}
      - MSC_SYNC_INTERVAL_SECONDS=${MSC_SYNC_INTERVAL_SECONDS:-60}
      - MSC_BACKUP_KEEP=${MSC_BACKUP_KEEP:-14}
      # Model card first-run defaults; the Web UI writes them into the DB afterwards.
      - MSC_LLM_BASE_URL=${MSC_LLM_BASE_URL:-}
      - MSC_LLM_MODEL=${MSC_LLM_MODEL:-}
      - MSC_LLM_API_KEY=${MSC_LLM_API_KEY:-}
      - MSC_LLM_TEMPERATURE=${MSC_LLM_TEMPERATURE:-0.2}
      - MSC_LLM_MAX_TOKENS=${MSC_LLM_MAX_TOKENS:-1500}
      - MSC_LLM_TIMEOUT_SECONDS=${MSC_LLM_TIMEOUT_SECONDS:-180}
      - MSC_LLM_MAX_INPUT_CHARS=${MSC_LLM_MAX_INPUT_CHARS:-12000}
      - MSC_SUMMARY_AUTO_ENABLED=${MSC_SUMMARY_AUTO_ENABLED:-false}
      - MSC_SUMMARY_AUTO_TIME=${MSC_SUMMARY_AUTO_TIME:-23:30}
      - MSC_SUMMARY_TIMEZONE=${MSC_SUMMARY_TIMEZONE:-}
      - MSC_SUMMARY_CATEGORY=${MSC_SUMMARY_CATEGORY:-project}
      - MSC_SUMMARY_PRIORITY=${MSC_SUMMARY_PRIORITY:-medium}
      - MSC_SUMMARY_ARCHIVE_SOURCES=${MSC_SUMMARY_ARCHIVE_SOURCES:-false}
      # RAG kill switch + provider first-run seeds; same doctrine as the
      # chat card: .env seeds once, the database wins afterwards.
      - MSC_RAG_ENABLED=${MSC_RAG_ENABLED:-true}
      - MSC_EMBED_BASE_URL=${MSC_EMBED_BASE_URL:-}
      - MSC_EMBED_MODEL=${MSC_EMBED_MODEL:-}
      - MSC_EMBED_API_KEY=${MSC_EMBED_API_KEY:-}
      - MSC_RERANK_BASE_URL=${MSC_RERANK_BASE_URL:-}
      - MSC_RERANK_MODEL=${MSC_RERANK_MODEL:-}
      - MSC_RERANK_API_KEY=${MSC_RERANK_API_KEY:-}
      - MSC_WHISPER_BASE_URL=${MSC_WHISPER_BASE_URL:-}
      - MSC_WHISPER_MODEL=${MSC_WHISPER_MODEL:-}
      - MSC_WHISPER_API_KEY=${MSC_WHISPER_API_KEY:-}
      - MSC_ECHO_BASE_URL=${MSC_ECHO_BASE_URL:-}
      - MSC_ECHO_MODEL=${MSC_ECHO_MODEL:-}
      - MSC_ECHO_API_KEY=${MSC_ECHO_API_KEY:-}
      # Where echo commentaries (save=true) land; empty = the memory directory.
      - MSC_ECHO_DIR=${MSC_ECHO_DIR:-}
      - MSC_RAG_RECALL_TOP=${MSC_RAG_RECALL_TOP:-30}
      - MSC_RAG_RERANK_TOPN=${MSC_RAG_RERANK_TOPN:-10}
      - MSC_RAG_RRF_K=${MSC_RAG_RRF_K:-60}
      - MSC_RAG_EMBED_BATCH=${MSC_RAG_EMBED_BATCH:-16}
    restart: unless-stopped
    # The access log is the audit trail of a no-login service — keep it, but
    # cap it so it cannot fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
