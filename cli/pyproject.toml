[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-cli"
version = "2.6.5"
description = "MSC CLI — Memory Sync Client command line tool"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.scripts]
msc = "msc_cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["msc_cli*"]
